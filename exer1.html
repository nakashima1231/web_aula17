<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadros</title>

    <style>
        main {
            display: grid;
            grid-template-columns: repeat(3, 160px);
            gap: 10px;
            padding: 20px;
        }

        .caixa {
            height: 80px;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
    </style>

    <script>
        window.onload = inicio;

        let contador = 1;

        function inicio() {
            adicionarItens(9);

            window.addEventListener("scroll", carregarMais);
        }

        function carregarMais() {
            const fimPagina =
                window.innerHeight + window.scrollY >=
                document.body.offsetHeight - 100;

            if (fimPagina) {
                adicionarItens(6);
            }
        }

        function adicionarItens(qtd) {
            let destino = document.getElementsByTagName("main")[0];

            for (let i = 0; i < qtd; i++) {
                destino.innerHTML += novaCaixa(`Item: ${contador}`);
                contador++;
            }
        }

        function novaCaixa(conteudo) {
            return `<div class="caixa">${conteudo}</div>`;
        }
    </script>
</head>

<body>
    <main></main>
</body>

</html>
